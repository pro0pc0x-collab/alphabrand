<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة الطلبات - Digital Agency MA</title>
    <script src="../auth-check.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== نفس الـ CSS السابق ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #006D5B;
            --primary-light: #00B894;
            --primary-dark: #004D3F;
            --secondary: #FDCB6E;
            --accent: #E17055;
            --accent-blue: #0984E3;
            --bg-primary: #0A0A0A;
            --bg-secondary: #141414;
            --bg-card: #1A1A1A;
            --bg-card-hover: #222222;
            --bg-sidebar: #0D0D0D;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-muted: #6B6B6B;
            --border-primary: rgba(0, 109, 91, 0.3);
            --border-secondary: rgba(255, 255, 255, 0.06);
            --gradient-primary: linear-gradient(135deg, #006D5B, #00B894);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 60px rgba(0, 109, 91, 0.15);
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2rem;
            --space-xl: 3rem;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --sidebar-width: 260px;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-secondary);
            padding: var(--space-lg) var(--space-md);
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) 0;
            margin-bottom: var(--space-xl);
            text-decoration: none;
            border-bottom: 1px solid var(--border-secondary);
            padding-bottom: var(--space-lg);
        }

        .sidebar-logo .icon {
            font-size: 2rem;
            line-height: 1;
        }
        .sidebar-logo .text {
            display: flex;
            flex-direction: column;
        }
        .sidebar-logo .text .brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .sidebar-logo .text .sub {
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--primary-light);
            font-weight: 600;
            text-transform: uppercase;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .sidebar-nav .nav-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            padding: var(--space-md) var(--space-sm) var(--space-xs);
            font-weight: 600;
        }

        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: 0.7rem var(--space-sm);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.25s ease;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .sidebar-nav .nav-item:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .sidebar-nav .nav-item.active {
            background: var(--bg-card);
            color: var(--text-primary);
            border-right: 3px solid var(--primary-light);
        }

        .sidebar-nav .nav-item .nav-icon {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-nav .nav-item .nav-badge {
            margin-right: auto;
            background: var(--accent);
            color: white;
            font-size: 0.65rem;
            padding: 0.15rem 0.6rem;
            border-radius: 50px;
            font-weight: 600;
        }

        .sidebar-nav .nav-item .nav-badge.blue {
            background: var(--accent-blue);
        }
        .sidebar-nav .nav-item .nav-badge.green {
            background: var(--primary-light);
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-secondary);
            padding-top: var(--space-md);
            margin-top: auto;
        }

        .sidebar-footer .user-card {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm);
            border-radius: var(--radius-sm);
            transition: background 0.25s ease;
            cursor: pointer;
        }

        .sidebar-footer .user-card:hover {
            background: var(--bg-card);
        }

        .sidebar-footer .user-card .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .sidebar-footer .user-card .info {
            flex: 1;
        }
        .sidebar-footer .user-card .info .name {
            font-size: 0.85rem;
            font-weight: 600;
        }
        .sidebar-footer .user-card .info .role {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .sidebar-footer .user-card .logout {
            font-size: 1.1rem;
            color: var(--text-muted);
            transition: color 0.25s ease;
            cursor: pointer;
        }
        .sidebar-footer .user-card .logout:hover {
            color: var(--accent);
        }

        /* ===== Main Content ===== */
        .main-content {
            margin-right: var(--sidebar-width);
            padding: var(--space-xl);
            flex: 1;
            min-height: 100vh;
            background: var(--bg-primary);
            position: relative;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
            gap: var(--space-md);
        }

        .page-header .title-section h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .page-header .title-section h1 .highlight {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header .title-section p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .page-header .actions {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.875rem;
            font-family: var(--font-family);
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: var(--text-primary);
            background: var(--bg-card);
            border: 1px solid var(--border-secondary);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }

        .btn-primary:hover {
            box-shadow: var(--shadow-glow);
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--border-secondary);
        }

        .btn-ghost:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        .btn-danger {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-hamburger {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            padding: 0.5rem 0.8rem;
            color: var(--text-primary);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .widget {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-secondary);
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .widget:hover {
            border-color: var(--border-primary);
        }

        .widget-body {
            padding: var(--space-lg);
        }

        .table-responsive {
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .table th {
            text-align: right;
            padding: 0.75rem var(--space-sm);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-secondary);
        }

        .table td {
            padding: 0.75rem var(--space-sm);
            border-bottom: 1px solid var(--border-secondary);
            color: var(--text-secondary);
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        .table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .table .user-cell {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .table .user-cell .avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .table .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(0, 184, 148, 0.15);
            color: var(--primary-light);
        }

        .badge-warning {
            background: rgba(253, 203, 110, 0.15);
            color: var(--secondary);
        }

        .badge-danger {
            background: rgba(225, 112, 85, 0.15);
            color: var(--accent);
        }

        .badge-info {
            background: rgba(9, 132, 227, 0.15);
            color: var(--accent-blue);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-right: 0;
                padding: var(--space-md);
            }
            .btn-hamburger {
                display: inline-flex;
            }
            .page-header .title-section h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <a href="dashboard.html" class="sidebar-logo">
            <span class="icon">🚀</span>
            <div class="text">
                <span class="brand">Digital Agency</span>
                <span class="sub">MOROCCO</span>
            </div>
        </a>
        <nav class="sidebar-nav">
            <span class="nav-label">القائمة الرئيسية</span>
            <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span>لوحة التحكم</a>
            <a href="clients.html" class="nav-item"><span class="nav-icon">👥</span>العملاء <span class="nav-badge green">12</span></a>
            <a href="orders.html" class="nav-item active"><span class="nav-icon">📦</span>الطلبات <span class="nav-badge">5</span></a>
            <a href="messages.html" class="nav-item"><span class="nav-icon">💬</span>الرسائل <span class="nav-badge blue">3</span></a>
            <span class="nav-label" style="margin-top:var(--space-md);">التقارير</span>
            <a href="analytics.html" class="nav-item"><span class="nav-icon">📈</span>الإحصائيات</a>
            <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span>الإعدادات</a>
            <span class="nav-label" style="margin-top:var(--space-md);">الموقع</span>
            <a href="../../frontend/index.html" class="nav-item"><span class="nav-icon">🏠</span>زيارة الموقع</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="avatar">أ</div>
                <div class="info">
                    <div class="name">أحمد محمد</div>
                    <div class="role">مدير النظام</div>
                </div>
                <span class="logout" onclick="logout()">🚪</span>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div class="title-section">
                <h1>📦 <span class="highlight">إدارة الطلبات</span></h1>
                <p>عرض وإدارة جميع الطلبات</p>
            </div>
            <div class="actions">
                <button class="btn btn-hamburger" onclick="toggleSidebar()">☰</button>
                <button class="btn btn-primary btn-sm">➕ إضافة طلب</button>
            </div>
        </header>

        <div class="widget animate-in">
            <div class="widget-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>العميل</th>
                                <th>الخدمة</th>
                                <th>المبلغ</th>
                                <th>الحالة</th>
                                <th>التاريخ</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable">
                            <!-- سيتم تحميلها بواسطة JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        });

        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('token');
                window.location.href = '../../frontend/index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const orders = [
                { id: '#ORD-001', client: 'أحمد محمد', service: 'تطوير موقع', amount: '5,500 MAD', status: 'completed',
                    date: '2024-01-15' },
                { id: '#ORD-002', client: 'سارة علي', service: 'تصميم تطبيق', amount: '8,000 MAD', status: 'in-progress',
                    date: '2024-01-14' },
                { id: '#ORD-003', client: 'يوسف مراد', service: 'حملة تسويق', amount: '3,200 MAD', status: 'pending',
                    date: '2024-01-13' },
                { id: '#ORD-004', client: 'فاطمة زهرة', service: 'تصوير درون', amount: '4,500 MAD', status: 'completed',
                    date: '2024-01-12' },
                { id: '#ORD-005', client: 'عبد الله رشيد', service: 'هوية بصرية', amount: '2,800 MAD', status: 'cancelled',
                    date: '2024-01-11' },
            ];

            const statusMap = {
                'pending': 'قيد الانتظار',
                'completed': 'مكتمل',
                'in-progress': 'قيد التنفيذ',
                'cancelled': 'ملغي'
            };

            const badgeMap = {
                'pending': 'badge-warning',
                'completed': 'badge-success',
                'in-progress': 'badge-info',
                'cancelled': 'badge-danger'
            };

            const table = document.getElementById('ordersTable');
            table.innerHTML = orders.map((order) => `
                    <tr>
                        <td>${order.id}</td>
                        <td>
                            <div class="user-cell">
                                <span class="avatar-sm">${order.client.charAt(0)}</span>
                                ${order.client}
                            </div>
                        </td>
                        <td>${order.service}</td>
                        <td>${order.amount}</td>
                        <td><span class="badge ${badgeMap[order.status]}">${statusMap[order.status] || order.status}</span></td>
                        <td>${order.date}</td>
                        <td class="actions-cell">
                            <button class="btn btn-ghost btn-sm">✏️</button>
                            <button class="btn btn-danger btn-sm">🗑️</button>
                        </td>
                    </tr>
                `).join('');
        });
    </script>

</body>
</html>
