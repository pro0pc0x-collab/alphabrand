<!-- Navbar -->

  <nav class="nav-container">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-icon">🚀</div>
      <div class="nav-logo-text">
        <span>Digital Agency</span>

<!-- ========== SERVICES PAGE ========== -->
<section class="section" style="padding-top: 8rem;">
  <div class="container">
    <div class="section-header">
      <div class="badge">⚡ خدماتنا</div>
      <h1>كل ما تحتاجه <span class="text-gradient">رقمياً</span></h1>
      <p>نقدم حلولاً رقمية متكاملة تساعد عملك على النمو والتوسع في العالم الرقمي</p>
    </div>

    <div class="services-grid" id="servicesGrid">
      <!-- سيتم تحميلها بواسطة JavaScript -->
    </div>
  </div>
</section>

<div class="services-grid" id="servicesGrid">
    <!-- سيتم تحميلها بواسطة JavaScript -->
</div>

<script>
    // عند الضغط على زر "اطلب الخدمة"
    document.addEventListener('click', function(e) {
        if (e.target.closest('.service-card .btn')) {
            const card = e.target.closest('.service-card');
            const serviceId = card.dataset.serviceId;
            window.location.href = `request-service.html?service=${serviceId}`;
        }
    });
</script>

<!-- Footer -->
<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2024 Digital Agency MA. جميع الحقوق محفوظة.</p>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/services.js"></script>
<script>
  // إخفاء شاشة التحميل
  document.addEventListener('DOMContentLoaded', function() {
    const loader = document.getElementById('pageLoader');
    if (loader) loader.style.display = 'none';
  });
</script>
