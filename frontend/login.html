<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - Digital Agency MA</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-primary);
        }
        .login-box {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid var(--border-secondary);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-box h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .login-box .subtitle { color: var(--text-muted); margin-bottom: 2rem; }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            color: #333;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-google:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(255,255,255,0.2); }
        .btn-google svg { width: 20px; height: 20px; }
        .divider { margin: 20px 0; color: var(--text-muted); font-size: 13px; }
        .back-link { color: var(--primary-light); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🚀 <span class="text-gradient">Digital Agency</span></h1>
            <p class="subtitle">سجل الدخول للوصول إلى لوحة التحكم</p>
            
            <a href="/auth/google" class="btn-google">
                <svg viewBox="0 0 48 48" width="20" height="20">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                تسجيل الدخول بحساب Google
            </a>
            
            <div class="divider">─ أو ─</div>
            <p style="color: var(--text-muted); font-size: 13px;">
                ليس لديك حساب؟ <a href="request-service.html" class="back-link">اطلب خدمة</a>
            </p>
            <br>
            <a href="index.html" class="back-link">← العودة إلى الرئيسية</a>
        </div>
    </div>
    
    <script>
        // استقبال التوكن من Google
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const error = urlParams.get('error');
            
            if (error) {
                alert('❌ فشل تسجيل الدخول: ' + error);
            }
            
            if (token) {
                console.log('✅ تم استلام التوكن');
                localStorage.setItem('token', token);
                alert('✅ تم تسجيل الدخول بنجاح!');
                window.location.href = '/dashboard/admin/dashboard.html';
            }
        });
    </script>
</body>
</html>
